<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#031a2d">
<title>LUCKY OCEAN</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031a2d;color:#fff;font-family:Arial,sans-serif}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px 15px calc(18px + env(safe-area-inset-bottom));}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-size:22px;font-weight:900;letter-spacing:2px;text-shadow:0 0 14px #32dfff}
.subtitle{font-size:9px;letter-spacing:2px;color:#9ddff2;margin-top:4px}
.stats{display:flex;gap:7px}
.stat{background:#031d31bb;border:1px solid #4bdfff55;border-radius:12px;padding:9px 11px;backdrop-filter:blur(8px);text-align:center;min-width:76px}
.stat small{display:block;color:#9ddff2;font-size:9px;margin-bottom:4px}
.stat strong{font-size:15px;color:#fff}
.bottom{pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.status{text-align:center;font-size:11px;color:#a9e9fa;text-shadow:0 1px 5px #001a2b}
.panel{background:linear-gradient(145deg,#062a42eF,#031629ee);border:1px solid #3cd9ff55;border-radius:18px;padding:13px;box-shadow:0 0 25px #00bfff18;backdrop-filter:blur(12px)}
.panel-title{font-size:11px;letter-spacing:1.5px;color:#9beaff;margin-bottom:10px;font-weight:bold}
.actions{display:flex;gap:9px}
button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;color:white;cursor:pointer}
#feedBtn{flex:1;background:linear-gradient(110deg,#00bde8,#0875cb);box-shadow:0 5px 18px #00bfff35}
#soundBtn{background:#103b55;border:1px solid #4bdfff66;min-width:54px}
.packages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.package{background:#0a3852;border:1px solid #36cfff66;border-radius:12px;padding:11px 5px;text-align:center}
.package strong{display:block;font-size:14px;color:#fff}
.package span{display:block;font-size:10px;color:#9ceaff;margin-top:5px}
.package button{margin-top:8px;width:100%;padding:8px 3px;font-size:10px;background:#087fba}
.sound-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:10px;color:#b9e9f7}
.sound-row input{flex:1;accent-color:#16cfff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#031a2d;z-index:10;color:#8deaff;letter-spacing:3px;font-size:13px;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#052a40ee;border:1px solid #4bdfff;border-radius:12px;padding:12px 18px;font-size:12px;display:none;z-index:20;text-align:center;max-width:85%}
@media(max-height:650px){
 .overlay{padding:12px}
 .panel{padding:10px}
 .package{padding:8px 4px}
 button{padding:10px}
 .brand{font-size:18px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<canvas id="world"></canvas>

<div id="loading">LOADING UNDERWATER WORLD…</div>
<div id="message"></div>

<div class="overlay">
  <div class="top">
    <div>
      <div class="brand">LUCKY OCEAN</div>
      <div class="subtitle">YOUR LITTLE UNDERWATER WORLD</div>
    </div>
    <div class="stats">
      <div class="stat">
        <small>FOOD BALANCE</small>
        <strong id="foodBalance">20</strong>
      </div>
      <div class="stat">
        <small>MY FISH</small>
        <strong id="fishCount">2</strong>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="status" id="worldStatus">WELCOME TO YOUR OCEAN</div>

    <div class="panel">
      <div class="panel-title">OCEAN CARE</div>
      <div class="actions">
        <button id="feedBtn">🐟 FEED FISH</button>
        <button id="soundBtn">🔊</button>
      </div>
      <div class="sound-row">
        <span>VOLUME</span>
        <input id="volume" type="range" min="0" max="100" value="35">
        <span id="volumeValue">35%</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">GET MORE FISH FOOD</div>
      <div class="packages">
        <div class="package">
          <strong>1,000 MMK</strong>
          <span>10 FOOD</span>
          <button data-food="10" data-price="1000">SELECT</button>
        </div>
        <div class="package">
          <strong>3,000 MMK</strong>
          <span>35 FOOD</span>
          <button data-food="35" data-price="3000">SELECT</button>
        </div>
        <div class="package">
          <strong>5,000 MMK</strong>
          <span>60 FOOD</span>
          <button data-food="60" data-price="5000">SELECT</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('world');
const loading = document.getElementById('loading');
const statusText = document.getElementById('worldStatus');
const message = document.getElementById('message');

let scene, camera, renderer, clock;
let fish = [];
let bubbles = [];
let foodPellets = [];
let plants = [];
let soundOn = true;
let volume = 0.35;
let audioContext = null;
let foodBalance = Number(localStorage.getItem('luckyOceanFood') || 20);
let feeding = false;

document.getElementById('foodBalance').textContent = foodBalance;

function showMessage(text){
  message.textContent = text;
  message.style.display = 'block';
  setTimeout(()=>message.style.display='none',2300);
}

function updateFood(){
  document.getElementById('foodBalance').textContent = foodBalance;
  localStorage.setItem('luckyOceanFood',String(foodBalance));
}

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x031b31);
  scene.fog = new THREE.FogExp2(0x06334c,0.027);

  camera = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,150);
  camera.position.set(0,5,17);
  camera.lookAt(0,2,0);

  renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;

  clock = new THREE.Clock();

  const ambient = new THREE.AmbientLight(0x77cfff,1.5);
  scene.add(ambient);

  const blueLight = new THREE.PointLight(0x1caeff,35,45);
  blueLight.position.set(-7,8,5);
  scene.add(blueLight);

  const cyanLight = new THREE.PointLight(0x00ffd5,22,30);
  cyanLight.position.set(8,3,-5);
  scene.add(cyanLight);

  createOceanFloor();
  createRocks();
  createRuins();
  createCorals();
  createPlants();
  createSunRays();
  createBubbles(85);

  loadFish('./jikin-goldfish%20%281%29.glb','Jikin Goldfish',-3,3.1,0.5,1.45);
  loadFish('./betta-splendens%20%281%29.glb','Pearl Blue Betta',3,2.5,-1,1.15);

  window.addEventListener('resize',onResize);
  animate();

  setTimeout(()=>{
    loading.classList.add('hide');
    statusText.textContent='YOUR UNDERWATER WORLD IS READY';
  },1200);
}

function createOceanFloor(){
  const geo = new THREE.PlaneGeometry(100,100,30,30);
  const mat = new THREE.MeshStandardMaterial({color:0x123e49,roughness:1});
  const floor = new THREE.Mesh(geo,mat);
  floor.rotation.x=-Math.PI/2;
  floor.position.y=-1.2;
  scene.add(floor);

  const sand = new THREE.Mesh(
    new THREE.CircleGeometry(35,64),
    new THREE.MeshStandardMaterial({color:0x174957,roughness:1})
  );
  sand.rotation.x=-Math.PI/2;
  sand.position.y=-1.17;
  scene.add(sand);
}

function createRocks(){
  for(let i=0;i<28;i++){
    const radius=0.35+Math.random()*1.15;
    const geo=new THREE.DodecahedronGeometry(radius,1);
    const mat=new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(0.52+Math.random()*0.08,0.35,0.16+Math.random()*0.12),
      roughness:1
    });
    const rock=new THREE.Mesh(geo,mat);
    rock.position.set((Math.random()-0.5)*27,-0.7+Math.random()*0.5,-7+Math.random()*-4);
    rock.scale.y=0.55+Math.random()*0.7;
    scene.add(rock);
  }
}

function createRuins(){
  const stoneMat=new THREE.MeshStandardMaterial({color:0x285866,roughness:0.9});
  const glowMat=new THREE.MeshStandardMaterial({
    color:0x126c79,emissive:0x087b91,emissiveIntensity:0.45,roughness:0.7
  });

  function pillar(x,z,height){
    const base=new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,.35,12),stoneMat);
    base.position.set(x,-0.65,z);
    scene.add(base);

    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.32,.42,height,12),stoneMat);
    shaft.position.set(x,-0.45+height/2,z);
    scene.add(shaft);

    const top=new THREE.Mesh(new THREE.BoxGeometry(1.05,.3,1.05),glowMat);
    top.position.set(x,height-0.45,z);
    scene.add(top);
  }

  pillar(-8,-8,5.2);
  pillar(-5,-9,4.5);
  pillar(6,-9,4.8);
  pillar(9,-8,5.5);

  const arch=new THREE.Mesh(
    new THREE.TorusGeometry(2.5,.25,10,32,Math.PI),
    stoneMat
  );
  arch.position.set(0,2,-10);
  scene.add(arch);

  const arch2=arch.clone();
  arch2.scale.set(1.35,1.1,1);
  arch2.position.set(-10,2,-13);
  scene.add(arch2);
}

function createCorals(){
  const colors=[0xff5b8d,0xffa45b,0x8e75ff,0x29e0c1,0xffd166];

  for(let i=0;i<22;i++){
    const group=new THREE.Group();
    const color=colors[i%colors.length];
    const material=new THREE.MeshStandardMaterial({
      color,emissive:color,emissiveIntensity:0.17,roughness:.65
    });

    const height=.5+Math.random()*1.2;
    for(let j=0;j<4;j++){
      const branch=new THREE.Mesh(
        new THREE.CylinderGeometry(.035,.12,height,7),
        material
      );
      branch.position.set((Math.random()-.5)*.4,height*.35,0);
      branch.rotation.z=(Math.random()-.5)*.9;
      group.add(branch);

      const tip=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),material);
      tip.position.copy(branch.position);
      tip.y+=height*.48;
      group.add(tip);
    }

    group.position.set((Math.random()-.5)*23,-.9,-3-Math.random()*7);
    scene.add(group);
  }
}

function createPlants(){
  for(let i=0;i<18;i++){
    const group=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({
      color:i%2?0x16a58d:0x287e8d,
      roughness:.8,
      side:THREE.DoubleSide
    });

    for(let j=0;j<3;j++){
      const leaf=new THREE.Mesh(new THREE.ConeGeometry(.22,2+Math.random()*1.5,7),mat);
      leaf.position.set((j-1)*.25,1,0);
      leaf.rotation.z=(j-1)*.25;
      group.add(leaf);
    }

    group.position.set((Math.random()-.5)*24,-1,-2-Math.random()*7);
    group.userData.phase=Math.random()*6;
    scene.add(group);
    plants.push(group);
  }
}

function createSunRays(){
  const rayMat=new THREE.MeshBasicMaterial({
    color:0x70dfff,transparent:true,opacity:.055,side:THREE.DoubleSide,
    depthWrite:false
  });

  for(let i=0;i<7;i++){
    const ray=new THREE.Mesh(new THREE.PlaneGeometry(1.1,17),rayMat);
    ray.position.set(-8+i*2.7,5,-5);
    ray.rotation.z=(Math.random()-.5)*.18;
    scene.add(ray);
  }
}

function createBubbles(count){
  const geo=new THREE.SphereGeometry(.045,8,8);
  const mat=new THREE.MeshBasicMaterial({color:0x9ceeff,transparent:true,opacity:.55});

  for(let i=0;i<count;i++){
    const bubble=new THREE.Mesh(geo,mat);
    bubble.position.set((Math.random()-.5)*25,Math.random()*9-1,(Math.random()-.5)*12-3);
    bubble.scale.setScalar(.5+Math.random()*1.5);
    bubble.userData.speed=.3+Math.random()*.8;
    bubble.userData.offset=Math.random()*6;
    scene.add(bubble);
    bubbles.push(bubble);
  }
}

function createFallbackFish(color,accent){
  const group=new THREE.Group();

  const bodyMat=new THREE.MeshStandardMaterial({
    color,metalness:.25,roughness:.28
  });
  const accentMat=new THREE.MeshStandardMaterial({
    color:accent,metalness:.3,roughness:.3
  });

  const body=new THREE.Mesh(new THREE.SphereGeometry(.75,24,18),bodyMat);
  body.scale.set(1.35,.72,.65);
  group.add(body);

  const tail=new THREE.Mesh(new THREE.ConeGeometry(.55,.95,4),accentMat);
  tail.rotation.z=-Math.PI/2;
  tail.position.x=-1.25;
  group.add(tail);

  const fin=new THREE.Mesh(new THREE.ConeGeometry(.35,.75,5),accentMat);
  fin.position.set(-.15,.65,0);
  fin.rotation.z=.3;
  group.add(fin);

  const eyeMat=new THREE.MeshBasicMaterial({color:0x050b16});
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.075,10,10),eyeMat);
  eye.position.set(.72,.18,.42);
  group.add(eye);

  return group;
}

function loadFish(url,name,x,y,z,scale){
  const loader=new GLTFLoader();

  loader.load(
    url,
    (gltf)=>{
      const model=gltf.scene;
      model.scale.setScalar(scale);
      model.position.set(x,y,z);
      model.traverse(obj=>{
        if(obj.isMesh){
          obj.castShadow=false;
          obj.receiveShadow=false;
        }
      });
      scene.add(model);

      fish.push({
        object:model,
        name,
        baseX:x,baseY:y,baseZ:z,
        phase:Math.random()*6,
        speed:.45+Math.random()*.3,
        mixer:gltf.animations.length?new THREE.AnimationMixer(model):null,
        foodTarget:null,
        fallback:false
      });

      if(gltf.animations.length){
        const mixer=new THREE.AnimationMixer(model);
        gltf.animations.forEach(clip=>mixer.clipAction(clip).play());
        fish[fish.length-1].mixer=mixer;
      }

      updateFishCount();
    },
    undefined,
    (error)=>{
      console.warn('Could not load fish model:',name,error);
      const fallback=createFallbackFish(
        name==='Jikin Goldfish'?0xe9e9e9:0x176bff,
        name==='Jikin Goldfish'?0xe83b46:0x6c38ff
      );
      fallback.position.set(x,y,z);
      fallback.scale.setScalar(scale);
      scene.add(fallback);

      fish.push({
        object:fallback,name,
        baseX:x,baseY:y,baseZ:z,
        phase:Math.random()*6,
        speed:.45+Math.random()*.3,
        mixer:null,
        foodTarget:null,
        fallback:true
      });
      updateFishCount();
    }
  );
}

function updateFishCount(){
  document.getElementById('fishCount').textContent=fish.length;
}

function dropFood(){
  const geo=new THREE.SphereGeometry(.09,8,8);
  const mat=new THREE.MeshStandardMaterial({
    color:0xffd36a,emissive:0x8a4b08,emissiveIntensity:.3
  });

  for(let i=0;i<7;i++){
    const pellet=new THREE.Mesh(geo,mat);
    pellet.position.set((Math.random()-.5)*2,7+Math.random()*1.5,(Math.random()-.5)*2);
    pellet.userData.speed=1.1+Math.random()*.8;
    pellet.userData.life=9;
    scene.add(pellet);
    foodPellets.push(pellet);
  }

  fish.forEach(f=>f.foodTarget=true);
}

function playTone(freq=550,duration=.12){
  if(!soundOn)return;
  try{
    audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.frequency.value=freq;
    gain.gain.value=volume*.08;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
    osc.stop(audioContext.currentTime+duration);
  }catch(e){console.warn('Audio unavailable',e)}
}

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  fish.forEach((f,i)=>{
    if(f.mixer)f.mixer.update(delta);

    const targetX=f.foodTarget&&foodPellets.length
      ?foodPellets[0].position.x
      :f.baseX+Math.sin(t*f.speed+f.phase)*2.1;

    const targetY=f.foodTarget&&foodPellets.length
      ?Math.max(0,foodPellets[0].position.y-.5)
      :f.baseY+Math.sin(t*1.2+f.phase)*.55;

    f.object.position.x+=(targetX-f.object.position.x)*delta*.55;
    f.object.position.y+=(targetY-f.object.position.y)*delta*.5;
    f.object.position.z=f.baseZ+Math.sin(t*.7+f.phase)*.65;

    const direction=targetX-f.object.position.x;
    if(Math.abs(direction)>.08){
      f.object.rotation.y=direction>0?0:Math.PI;
    }

    if(f.fallback){
      f.object.rotation.z=Math.sin(t*3+f.phase)*.06;
      if(f.object.children[1]){
        f.object.children[1].rotation.y=Math.sin(t*8+f.phase)*.3;
      }
    }
  });

  bubbles.forEach(b=>{
    b.position.y+=b.userData.speed*delta;
    b.position.x+=Math.sin(t+b.userData.offset)*delta*.12;
    if(b.position.y>10){
      b.position.y=-1.5;
      b.position.x=(Math.random()-.5)*25;
    }
  });

  foodPellets=foodPellets.filter(p=>{
    p.position.y-=p.userData.speed*delta;
    p.position.x+=Math.sin(t*2+p.position.z)*delta*.15;
    p.userData.life-=delta;
    if(p.position.y<-.7||p.userData.life<=0){
      scene.remove(p);
      p.geometry.dispose();
      return false;
    }
    return true;
  });

  if(foodPellets.length===0){
    fish.forEach(f=>f.foodTarget=false);
    feeding=false;
  }

  plants.forEach(p=>{
    p.rotation.z=Math.sin(t*.8+p.userData.phase)*.055;
  });

  camera.position.x=Math.sin(t*.12)*.35;
  camera.lookAt(0,2,0);

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
}

document.getElementById('feedBtn').addEventListener('click',()=>{
  if(foodBalance<=0){
    showMessage('Not enough food! Please get more food.');
    playTone(220,.2);
    return;
  }
  if(feeding)return;

  foodBalance--;
  updateFood();
  feeding=true;
  dropFood();
  playTone(620,.15);
  statusText.textContent='YUMMY! YOUR FISH ARE EATING';
});

document.getElementById('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(soundOn)playTone(520,.12);
});

document.getElementById('volume').addEventListener('input',e=>{
  volume=Number(e.target.value)/100;
  document.getElementById('volumeValue').textContent=e.target.value+'%';
});

document.querySelectorAll('.package button').forEach(button=>{
  button.addEventListener('click',()=>{
    const amount=button.dataset.food;
    const price=button.dataset.price;
    showMessage(`Selected ${amount} FOOD — ${Number(price).toLocaleString()} MMK. Payment integration is not active yet.`);
  });
});

window.addEventListener('error',e=>{
  console.error('App error:',e.message);
  statusText.textContent='WORLD ERROR — CHECK CONNECTION';
});

window.addEventListener('unhandledrejection',e=>{
  console.error('App promise error:',e.reason);
  statusText.textContent='SOME 3D ASSETS COULD NOT LOAD';
});

try{
  init();
}catch(error){
  console.error('World initialization failed:',error);
  loading.textContent='WORLD FAILED TO START';
  statusText.textContent='PLEASE RELOAD THE APP';
}
</script>
</body>
</html>
