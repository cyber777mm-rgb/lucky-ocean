<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03152b">
<title>LUCKY OCEAN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #fff;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #174e78 0%, transparent 55%),
    linear-gradient(180deg, #061d38, #020817 90%);
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 14px 30px;
  overflow: hidden;
}

.header {
  text-align: center;
  padding: 10px 0 18px;
}

.header h1 {
  margin: 0;
  letter-spacing: 5px;
  font-size: 27px;
  color: #9beaff;
  text-shadow: 0 0 18px #28bfff;
}

.header p {
  margin: 7px 0 0;
  color: #b7d9ed;
  font-size: 12px;
  letter-spacing: 2px;
}

.balance {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.balance-card {
  flex: 1;
  padding: 13px;
  border: 1px solid #4ccfff55;
  border-radius: 14px;
  background: #092c49bb;
  box-shadow: 0 0 18px #00bfff18;
}

.balance-card small {
  display: block;
  color: #9cc8dc;
  margin-bottom: 6px;
}

.balance-card strong {
  color: #ffe28a;
  font-size: 18px;
}

.tank {
  position: relative;
  height: 410px;
  width: 100%;
  overflow: hidden;
  border: 3px solid #6bdcff;
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 15%, #55dfff33, transparent 45%),
    linear-gradient(180deg, #0a5a83 0%, #073a63 45%, #031b3b 100%);
  box-shadow:
    inset 0 0 35px #8ceaff55,
    0 0 25px #00bfff55;
}

.tank::before {
  content: "";
  position: absolute;
  inset: -20% 0 0;
  background: repeating-linear-gradient(
    110deg,
    transparent 0 45px,
    #b5f7ff13 48px 53px,
    transparent 58px 100px
  );
  animation: rays 9s linear infinite;
  pointer-events: none;
}

@keyframes rays {
  from { transform: translateX(-40px); }
  to { transform: translateX(40px); }
}

.water-glow {
  position: absolute;
  top: 10%;
  left: 20%;
  width: 60%;
  height: 55%;
  border-radius: 50%;
  background: #63eaff18;
  filter: blur(35px);
}

.bubble {
  position: absolute;
  bottom: -20px;
  width: 7px;
  height: 7px;
  border: 1px solid #c7f8ffbb;
  border-radius: 50%;
  background: #b9f8ff22;
  animation: rise linear infinite;
}

@keyframes rise {
  to {
    transform: translateY(-460px);
    opacity: 0;
  }
}

.plant {
  position: absolute;
  bottom: 30px;
  width: 12px;
  height: 95px;
  border-radius: 100% 0;
  background: linear-gradient(90deg, #0b694f, #35c58b);
  transform-origin: bottom;
  animation: plantMove 3s ease-in-out infinite alternate;
}

@keyframes plantMove {
  to { transform: rotate(12deg); }
}

.rock {
  position: absolute;
  bottom: 18px;
  width: 75px;
  height: 38px;
  border-radius: 50% 50% 25% 25%;
  background: linear-gradient(140deg, #718b9a, #1b3449);
  box-shadow: inset -8px -7px 12px #06172b;
}

.sand {
  position: absolute;
  bottom: 0;
  height: 26px;
  width: 100%;
  background: linear-gradient(#c4b68a, #726b57);
  opacity: .8;
}

.fish {
  position: absolute;
  width: 105px;
  height: 65px;
  z-index: 4;
  transform-origin: center;
  animation: swim 13s ease-in-out infinite alternate;
}

.fish svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 4px 7px #00101e99);
}

.fish.gold {
  top: 25%;
  left: 5%;
}

.fish.blue {
  top: 55%;
  left: 55%;
  width: 92px;
  animation-duration: 17s;
  animation-delay: -5s;
}

@keyframes swim {
  0% {
    transform: translate(0, 0) scaleX(1);
  }
  25% {
    transform: translate(100px, 25px) scaleX(1);
  }
  50% {
    transform: translate(190px, -25px) scaleX(-1);
  }
  75% {
    transform: translate(80px, 35px) scaleX(-1);
  }
  100% {
    transform: translate(0, -10px) scaleX(1);
  }
}

.feed-food {
  position: absolute;
  top: 10%;
  left: 50%;
  z-index: 8;
  font-size: 13px;
  animation: foodFall 2s ease-in forwards;
}

@keyframes foodFall {
  to {
    transform: translateY(300px);
    opacity: 0;
  }
}

.controls {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid #4ccfff55;
  border-radius: 18px;
  background: #082641;
}

.controls h2 {
  margin: 0 0 12px;
  color: #9beaff;
  font-size: 17px;
}

.feed-button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 13px;
  color: #06213a;
  background: linear-gradient(90deg, #8beaff, #f5d68a);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px #48dfff44;
}

.packages {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.package {
  padding: 12px 5px;
  border: 1px solid #6adfff66;
  border-radius: 12px;
  color: #fff;
  background: #0b3858;
  cursor: pointer;
}

.package.active {
  border-color: #ffe18b;
  background: #26516a;
  box-shadow: 0 0 12px #ffe18b55;
}

.package strong {
  display: block;
  color: #ffe18b;
  margin-bottom: 5px;
}

.wish {
  margin-top: 15px;
  text-align: center;
  color: #b8e7f8;
  font-size: 13px;
  line-height: 1.7;
}

.notice {
  margin-top: 15px;
  color: #8caec2;
  font-size: 11px;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <h1>LUCKY OCEAN</h1>
    <p>YOUR LITTLE UNDERWATER WORLD</p>
  </header>

  <section class="balance">
    <div class="balance-card">
      <small>အစာလက်ကျန်</small>
      <strong id="foodBalance">10</strong>
    </div>
    <div class="balance-card">
      <small>ငါးလေးများ</small>
      <strong>2 🐠</strong>
    </div>
  </section>

  <section class="tank" id="tank">
    <div class="water-glow"></div>

    <div class="fish gold" id="goldFish">
      <svg viewBox="0 0 120 70">
        <path d="M22 35 L3 12 Q-3 35 3 58 Z"
          fill="#ffb52e" stroke="#ffe29b" stroke-width="2"/>
        <ellipse cx="58" cy="35" rx="39" ry="23"
          fill="url(#gold)" stroke="#ffe29b" stroke-width="2"/>
        <path d="M53 15 Q68 -2 82 15"
          fill="#ffcf55" stroke="#ffe29b" stroke-width="2"/>
        <path d="M55 55 Q72 72 87 54"
          fill="#e88b22" stroke="#ffe29b" stroke-width="2"/>
        <circle cx="82" cy="28" r="5" fill="white"/>
        <circle cx="84" cy="28" r="2.5" fill="#102238"/>
        <path d="M92 40 Q100 45 106 38"
          fill="none" stroke="#783c19" stroke-width="2"/>
        <defs>
          <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#fff0a0"/>
            <stop offset=".45" stop-color="#ffbd36"/>
            <stop offset="1" stop-color="#d66b13"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="fish blue" id="blueFish">
      <svg viewBox="0 0 120 70">
        <path d="M22 35 L3 12 Q-3 35 3 58 Z"
          fill="#76dfff" stroke="#d8f8ff" stroke-width="2"/>
        <ellipse cx="58" cy="35" rx="39" ry="23"
          fill="url(#pearl)" stroke="#d8f8ff" stroke-width="2"/>
        <path d="M55 15 Q68 -3 82 15"
          fill="#a5ecff" stroke="#d8f8ff" stroke-width="2"/>
        <path d="M55 55 Q72 72 87 54"
          fill="#398ac4" stroke="#d8f8ff" stroke-width="2"/>
        <circle cx="82" cy="28" r="5" fill="white"/>
        <circle cx="84" cy="28" r="2.5" fill="#102238"/>
        <path d="M92 40 Q100 45 106 38"
          fill="none" stroke="#174d76" stroke-width="2"/>
        <defs>
          <linearGradient id="pearl" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#e8ffff"/>
            <stop offset=".5" stop-color="#69d9ff"/>
            <stop offset="1" stop-color="#2874ba"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="plant" style="left:8%;height:95px"></div>
    <div class="plant" style="left:16%;height:70px;animation-delay:-1s"></div>
    <div class="plant" style="right:12%;height:110px"></div>
    <div class="plant" style="right:20%;height:75px;animation-delay:-2s"></div>

    <div class="rock" style="left:28%"></div>
    <div class="rock" style="right:25%;width:55px"></div>
    <div class="sand"></div>
  </section>

  <section class="controls">
    <h2>🐠 ငါးလေးတွေကို ဂရုစိုက်မယ်</h2>

    <button class="feed-button" onclick="feedFish()">
      ငါးလေးတွေကို အစာကျွေးမယ်
    </button>

    <div class="packages">
      <button class="package active" onclick="selectPackage(1000,this)">
        <strong>1,000 MMK</strong>
        အစာ 10
      </button>
      <button class="package" onclick="selectPackage(3000,this)">
        <strong>3,000 MMK</strong>
        အစာ 35
      </button>
      <button class="package" onclick="selectPackage(5000,this)">
        <strong>5,000 MMK</strong>
        အစာ 60
      </button>
    </div>

    <div class="wish" id="wish">
      🌊 ရေအောက်ကမ္ဘာလေးထဲကို ကြိုဆိုပါတယ်။<br>
      ငါးလေးတွေနဲ့ အချိန်လေးကို ပျော်ရွှင်စွာ ဖြတ်သန်းပါ။
    </div>

    <div class="notice">
      ဤအရာသည် Demo Aquarium ဖြစ်သည်။<br>
      MMK package များအတွက် ငွေပေးချေမှုစနစ် မချိတ်ဆက်ရသေးပါ။
    </div>
  </section>

</div>

<script>
let food = 10;
let selectedPackage = 1000;

function updateBalance() {
  document.getElementById("foodBalance").textContent = food;
}

function selectPackage(amount, button) {
  selectedPackage = amount;

  document.querySelectorAll(".package").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("wish").textContent =
    amount.toLocaleString("en-US") +
    " MMK အစာ Package ကို ရွေးထားပါတယ်။ Demo အတွက်သာ ဖြစ်ပါတယ်။";
}

function feedFish() {
  if (food <= 0) {
    document.getElementById("wish").textContent =
      "အစာကုန်သွားပါပြီ။ Package ဝယ်ယူမှုကို မချိတ်ဆက်ရသေးပါ။";
    return;
  }

  food--;
  updateBalance();

  const tank = document.getElementById("tank");

  for (let i = 0; i < 5; i++) {
    const pellet = document.createElement("div");
    pellet.className = "feed-food";
    pellet.textContent = "🟡";
    pellet.style.left = (35 + Math.random() * 30) + "%";
    pellet.style.animationDelay = (i * 0.15) + "s";
    tank.appendChild(pellet);

    setTimeout(() => pellet.remove(), 2500);
  }

  document.getElementById("wish").textContent =
    "🐠 ငါးလေးတွေ အစာစားနေကြပါပြီ။ ပျော်ရွှင်ပါစေ။";
}

function createBubble() {
  const tank = document.getElementById("tank");
  const bubble = document.createElement("div");

  bubble.className = "bubble";
  bubble.style.left = Math.random() * 95 + "%";
  bubble.style.animationDuration = (4 + Math.random() * 5) + "s";
  bubble.style.width = (4 + Math.random() * 7) + "px";
  bubble.style.height = bubble.style.width;

  tank.appendChild(bubble);

  setTimeout(() => bubble.remove(), 10000);
}

setInterval(createBubble, 450);
updateBalance();
</script>

</body>
</html>
